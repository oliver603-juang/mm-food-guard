<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MM 食品專家分析系統 - 醫療靈媒權重版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .tier-badge { font-size: 0.65rem; padding: 2px 8px; border-radius: 999px; font-weight: 700; text-transform: uppercase; }
        .tier-1 { background-color: #fee2e2; color: #991b1b; }
        .tier-2 { background-color: #ffedd5; color: #9a3412; }
        .tier-3 { background-color: #f1f5f9; color: #475569; }
        .redemption { background-color: #dcfce7; color: #166534; }
        .animate-slide-up { animation: slideUp 0.4s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Checkbox styling */
        input[type="checkbox"] { accent-color: #10b981; width: 1.1rem; height: 1.1rem; cursor: pointer; }
    </style>
</head>
<body class="text-slate-900">

    <div id="app" class="max-w-5xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="leaf" class="text-emerald-500"></i>
                    MM 食品專家分析系統
                </h1>
                <p class="text-slate-500 mt-1">醫療靈媒 (Medical Medium) 權重算法 V3.6</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleSettings()" class="p-2 rounded-full bg-white shadow-sm border border-slate-200 hover:bg-slate-50 transition-colors">
                    <i data-lucide="settings" class="w-5 h-5 text-slate-600"></i>
                </button>
                <div class="px-3 py-1 bg-emerald-100 text-emerald-700 rounded-full text-xs font-bold tracking-tight">專家系統已連線</div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- Input Panel -->
            <div class="lg:col-span-4 space-y-6">
                <div class="glass-card rounded-3xl p-6 shadow-xl border-emerald-100/50">
                    <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-slate-700">
                        <i data-lucide="camera" class="w-5 h-5"></i> 攝取來源輸入
                    </h2>
                    
                    <div id="dropZone" class="border-2 border-dashed border-slate-200 rounded-2xl p-6 text-center hover:border-emerald-400 transition-all cursor-pointer bg-white/40 group">
                        <input type="file" id="fileInput" class="hidden" accept="image/*" multiple>
                        <div id="uploadPlaceholder">
                            <i data-lucide="image-plus" class="w-12 h-12 mx-auto text-slate-300 mb-3 group-hover:text-emerald-400 transition-colors"></i>
                            <p class="text-slate-500 text-sm font-medium">點擊拍照或多選上傳</p>
                        </div>
                        <div id="imageGrid" class="hidden grid grid-cols-3 gap-2 mt-2"></div>
                    </div>

                    <button id="analyzeBtn" class="w-full mt-6 py-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-bold shadow-lg shadow-emerald-200 transition-all flex justify-center items-center gap-2 disabled:opacity-50">
                        <i data-lucide="brain-circuit" class="w-5 h-5"></i> 啟動 MM 分層權重分析
                    </button>
                    <button id="clearBtn" class="hidden w-full mt-3 py-2 text-slate-400 text-xs hover:text-red-500 font-medium">重設所有資料</button>
                </div>

                <div class="bg-white/60 rounded-3xl p-5 border border-slate-100 space-y-3">
                    <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest text-center">MM 權重邏輯說明</h3>
                    <div class="space-y-2">
                        <div class="flex items-center justify-between text-xs"><span class="text-red-600 font-bold">Tier 1 (蛋奶麩)</span><span>-40% 權重</span></div>
                        <div class="flex items-center justify-between text-xs"><span class="text-orange-600 font-bold">Tier 2 (隱藏油脂/香料)</span><span>-25% 權重</span></div>
                        <div class="flex items-center justify-between text-xs"><span class="text-slate-500 font-bold">Tier 3 (精製糖/醋)</span><span>-15% 權重</span></div>
                        <div class="flex items-center justify-between text-xs"><span class="text-emerald-600 font-bold">🌿 救贖機制</span><span>+20% 權重</span></div>
                    </div>
                </div>
            </div>

            <!-- Results Panel -->
            <div class="lg:col-span-8 space-y-6">
                <div id="loadingState" class="hidden glass-card rounded-3xl p-16 text-center shadow-lg">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-500 mx-auto mb-4"></div>
                    <p id="loadingText" class="text-slate-500 font-bold text-lg">正在掃描食品成份表...</p>
                </div>

                <div id="resultsList" class="space-y-6"></div>

                <!-- Email Box -->
                <div id="emailSection" class="hidden glass-card rounded-3xl p-6 shadow-xl border-2 border-emerald-50 animate-slide-up">
                    <h3 class="font-bold text-slate-800 flex items-center gap-2 mb-4">
                        <i data-lucide="mail-check" class="text-emerald-500"></i> 發送分析報表
                    </h3>
                    
                    <div class="space-y-4">
                        <!-- Recipient List Selection -->
                        <div id="recipientListContainer" class="grid grid-cols-1 md:grid-cols-2 gap-2">
                            <!-- JS will inject labels here -->
                        </div>

                        <!-- Add New Recipient -->
                        <div class="flex gap-2">
                            <input type="email" id="newEmailInput" placeholder="新增其他信箱..." class="flex-grow p-3 rounded-xl border border-slate-100 focus:ring-2 focus:ring-emerald-500/20 outline-none text-sm bg-slate-50/50">
                            <button onclick="addRecipient()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200 transition-all text-sm flex items-center gap-1">
                                <i data-lucide="plus" class="w-4 h-4"></i> 新增
                            </button>
                        </div>

                        <button id="sendEmailBtn" class="w-full py-4 bg-slate-800 text-white rounded-2xl font-bold hover:bg-slate-900 transition-all flex items-center justify-center gap-2 shadow-lg mt-2">
                            <i data-lucide="send" class="w-5 h-5"></i> 批次發送報表
                        </button>
                        <p id="emailStatus" class="text-center text-xs font-medium hidden"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- API Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-900/40 hidden flex items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl">
            <h3 class="text-xl font-bold text-slate-800 mb-2 flex items-center gap-2">
                <i data-lucide="key" class="text-slate-400"></i> API 引擎設定
            </h3>
            <p class="text-slate-500 text-sm mb-4 leading-relaxed">
                請輸入您的 Google Gemini API Key。金鑰將儲存在您的瀏覽器中。
            </p>
            <input type="password" id="apiKeyInput" placeholder="輸入 API Key..." class="w-full p-4 rounded-xl bg-slate-50 border-0 focus:ring-2 focus:ring-emerald-500/50 mb-4 font-mono">
            
            <a href="https://aistudio.google.com/app/apikey" target="_blank" class="flex items-center gap-2 text-xs font-bold text-emerald-600 hover:text-emerald-700 mb-6 group">
                <i data-lucide="external-link" class="w-3 h-3 transition-transform group-hover:-translate-y-0.5 group-hover:translate-x-0.5"></i>
                點此免費取得您的 API Key
            </a>

            <button onclick="saveSettings()" class="w-full py-4 bg-emerald-600 text-white rounded-xl font-bold shadow-lg shadow-emerald-100 mb-2">儲存設定</button>
            <button onclick="toggleSettings()" class="w-full py-2 text-slate-400 font-medium">稍後再說</button>
        </div>
    </div>

    <script>
        // --- System State ---
        let state = {
            apiKey: localStorage.getItem('mm_expert_api_key') || "",
            images: [],
            results: [],
            recipients: [
                { email: "oliver603@gmail.com", selected: true },
                { email: "yofarn@gmail.com", selected: true }
            ]
        };

        // --- MM Expert Engine ---
        class MMEngine {
            constructor() {
                this.weights = { tier1: 40, tier2: 25, tier3: 15, redemption: 20 };
            }
            calculate(data) {
                let score = 100;
                if (data.mm_tier1_count > 0) score -= (data.mm_tier1_count * this.weights.tier1);
                if (data.mm_tier2_count > 0) score -= (data.mm_tier2_count * this.weights.tier2);
                if (data.mm_tier3_count > 0) score -= (data.mm_tier3_count * this.weights.tier3);
                if (data.redemption_count > 0) score += (data.redemption_count * this.weights.redemption);
                return Math.max(0, Math.min(100, score));
            }
            getSafetyInfo(score) {
                if (score >= 85) return { label: '極致純淨', color: 'text-emerald-600', icon: 'shield-check' };
                if (score >= 65) return { label: '低負擔', color: 'text-emerald-500', icon: 'check-circle' };
                if (score >= 40) return { label: '過度加工', color: 'text-orange-500', icon: 'alert-circle' };
                return { label: '高度違禁', color: 'text-red-600', icon: 'shield-alert' };
            }
        }
        const engine = new MMEngine();

        // --- Image Compression for Email ---
        const compressImageForEmail = (dataUrl, maxWidth = 100) => {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const scale = maxWidth / img.width;
                    canvas.width = maxWidth;
                    canvas.height = img.height * scale;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.4));
                };
                img.src = dataUrl;
            });
        };

        // --- UI Logic ---
        lucide.createIcons();
        if (window.emailjs) window.emailjs.init("mYOFMMnqLdDxR0wjj");

        function renderRecipients() {
            const container = document.getElementById('recipientListContainer');
            container.innerHTML = state.recipients.map((r, idx) => `
                <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-100 bg-white/50 cursor-pointer hover:bg-white transition-all shadow-sm">
                    <input type="checkbox" ${r.selected ? 'checked' : ''} onchange="toggleRecipient(${idx})">
                    <span class="text-xs font-mono text-slate-600 truncate">${r.email}</span>
                </label>
            `).join('');
            lucide.createIcons();
        }

        function toggleRecipient(index) {
            state.recipients[index].selected = !state.recipients[index].selected;
        }

        function addRecipient() {
            const input = document.getElementById('newEmailInput');
            const email = input.value.trim();
            if (email && /^\S+@\S+\.\S+$/.test(email)) {
                state.recipients.push({ email, selected: true });
                input.value = '';
                renderRecipients();
            } else {
                alert("請輸入有效的電子郵件格式。");
            }
        }

        const fileInput = document.getElementById('fileInput');
        const imageGrid = document.getElementById('imageGrid');
        const analyzeBtn = document.getElementById('analyzeBtn');

        document.getElementById('dropZone').onclick = () => fileInput.click();
        fileInput.onchange = (e) => {
            Array.from(e.target.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    const preview = ev.target.result;
                    const emailThumb = await compressImageForEmail(preview, 80);
                    state.images.push({ 
                        base64: preview.split(',')[1], 
                        preview, emailThumb, 
                        type: file.type || 'image/jpeg' 
                    });
                    document.getElementById('uploadPlaceholder').classList.add('hidden');
                    imageGrid.classList.remove('hidden');
                    document.getElementById('clearBtn').classList.remove('hidden');
                    const div = document.createElement('div');
                    div.className = "aspect-square rounded-xl overflow-hidden border border-slate-100 shadow-sm animate-slide-up";
                    div.innerHTML = `<img src="${preview}" class="w-full h-full object-cover">`;
                    imageGrid.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
        };

        document.getElementById('clearBtn').onclick = () => location.reload();

        analyzeBtn.onclick = async () => {
            if (state.images.length === 0) return alert("請先選擇食品照片。");
            if (!state.apiKey) return toggleSettings();
            setLoading(true);
            document.getElementById('resultsList').innerHTML = "";
            state.results = [];
            try {
                for (let i = 0; i < state.images.length; i++) {
                    updateStatus(`分析中 (第 ${i+1}/${state.images.length})...`);
                    const raw = await callAI(state.images[i]);
                    raw.thumbnail = state.images[i].preview;
                    raw.emailThumb = state.images[i].emailThumb;
                    state.results.push(raw);
                    renderCard(raw);
                    if (i < state.images.length - 1) await new Promise(r => setTimeout(r, 1200));
                }
                document.getElementById('emailSection').classList.remove('hidden');
                renderRecipients();
                window.scrollTo({ top: document.getElementById('emailSection').offsetTop - 50, behavior: 'smooth' });
            } catch (err) {
                alert("分析失敗: " + err.message);
            } finally {
                setLoading(false);
            }
        };

        async function callAI(imgData) {
            const prompt = `你是一位精通《Medical Medium》(Anthony William) 營養體系的專家。請分析圖片並以 JSON 回傳：
            {
              "name": "食品名稱",
              "mm_tier1_count": Tier 1 數量,
              "mm_tier2_count": Tier 2 數量,
              "mm_tier3_count": Tier 3 數量,
              "redemption_count": 救贖加分數量,
              "detected_items": ["具體項目1", "具體項目2"],
              "expert_guidance": "針對排毒引導 (100字內)"
            }
            僅回傳 JSON。`;
            const payload = { contents: [{ role: "user", parts: [{ text: prompt }, { inlineData: { mimeType: imgData.type, data: imgData.base64 } }] }] };
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${state.apiKey}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
            });
            const data = await response.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            return JSON.parse(text.match(/\{[\s\S]*\}/)[0]);
        }

        function renderCard(data) {
            const score = engine.calculate(data);
            const info = engine.getSafetyInfo(score);
            const card = document.createElement('div');
            card.className = "glass-card rounded-3xl p-6 shadow-lg flex gap-6 animate-slide-up border-l-8";
            card.style.borderLeftColor = score < 50 ? '#ef4444' : '#10b981';
            card.innerHTML = `
                <div class="w-32 h-32 flex-shrink-0 rounded-2xl overflow-hidden shadow-inner bg-slate-50 border">
                    <img src="${data.thumbnail}" class="w-full h-full object-cover">
                </div>
                <div class="flex-grow">
                    <div class="flex justify-between items-start mb-2">
                        <div><h3 class="text-xl font-bold">${data.name}</h3><p class="text-xs font-bold ${info.color}">${info.label}</p></div>
                        <div class="text-center"><span class="text-4xl font-black ${info.color}">${score}</span><p class="text-[8px] text-slate-300 uppercase">MM Rating</p></div>
                    </div>
                    <div class="flex flex-wrap gap-2 mb-4">
                        ${data.mm_tier1_count > 0 ? `<span class="tier-badge tier-1">T1 x${data.mm_tier1_count}</span>` : ''}
                        ${data.mm_tier2_count > 0 ? `<span class="tier-badge tier-2">T2 x${data.mm_tier2_count}</span>` : ''}
                        ${data.mm_tier3_count > 0 ? `<span class="tier-badge tier-3">T3 x${data.mm_tier3_count}</span>` : ''}
                        ${data.redemption_count > 0 ? `<span class="tier-badge redemption">🌿 x${data.redemption_count}</span>` : ''}
                    </div>
                    <div class="p-3 bg-slate-50/50 rounded-xl border italic text-sm text-slate-600">"${data.expert_guidance}"</div>
                </div>
            `;
            document.getElementById('resultsList').appendChild(card);
            lucide.createIcons();
        }

        document.getElementById('sendEmailBtn').onclick = async () => {
            const selectedEmails = state.recipients.filter(r => r.selected).map(r => r.email);
            const statusEl = document.getElementById('emailStatus');
            if (selectedEmails.length === 0) return alert("請至少選擇或新增一個收件信箱。");
            
            const btn = document.getElementById('sendEmailBtn');
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> 正在傳送中...`;
            lucide.createIcons();

            const dateStr = new Date().toISOString().split('T')[0];
            const rows = state.results.map(r => {
                const s = engine.calculate(r);
                return `
                    <tr style="border-bottom: 1px solid #eeeeee;">
                        <td style="padding: 10px; text-align: center;"><img src="${r.emailThumb}" width="60" style="border-radius: 6px;"></td>
                        <td style="padding: 12px; font-family: sans-serif;"><strong style="color: #333;">${r.name}</strong><br><small style="color:#999;">T1:${r.mm_tier1_count} | T2:${r.mm_tier2_count} | T3:${r.mm_tier3_count}</small></td>
                        <td style="padding: 12px; text-align: center;"><div style="background-color: ${s < 50 ? '#ef4444' : '#10b981'}; color: white; padding: 4px 8px; border-radius: 15px; font-weight: bold;">${s}</div></td>
                        <td style="padding: 12px; font-size: 11px; color: #666;">"${r.expert_guidance}"</td>
                    </tr>
                `;
            }).join('');

            const emailHtml = `
                <div style="max-width: 600px; margin: 0 auto; font-family: sans-serif; border: 1px solid #eeeeee; border-radius: 12px; overflow: hidden; background-color: #ffffff;">
                    <div style="background-color: #10b981; color: white; padding: 20px; text-align: center;">
                        <h2 style="margin: 0;">MM Food Analysis Report</h2>
                        <p style="margin: 5px 0 0; opacity: 0.8;">Report Date: ${dateStr}</p>
                    </div>
                    <table width="100%" cellpadding="0" cellspacing="0" style="border-collapse: collapse;">
                        <thead style="background-color: #f8fafc; font-size: 11px; color: #64748b;">
                            <tr><th style="padding: 10px;">Image</th><th style="padding: 10px; text-align:left;">Product</th><th style="padding: 10px;">Score</th><th style="padding: 10px; text-align:left;">Guidance</th></tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;

            try {
                const emailStr = selectedEmails.join(',');
                await emailjs.send("service_5yh7x6g", "template_dlbyml8", {
                    email: emailStr, to_email: emailStr, recipient: emailStr,
                    subject: `MM Food Analysis Report - ${dateStr}`,
                    message: emailHtml
                });
                statusEl.innerText = "✅ 報表已發送成功！";
                statusEl.className = "text-center text-xs font-bold text-emerald-600 animate-pulse mt-2";
                statusEl.classList.remove('hidden');
            } catch (e) {
                console.error(e);
                statusEl.innerText = "❌ 發送失敗，請確認網路或限制。";
                statusEl.className = "text-center text-xs font-bold text-red-600 mt-2";
                statusEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="send" class="w-5 h-5"></i> 批次發送報表`;
                lucide.createIcons();
            }
        };

        function toggleSettings() { document.getElementById('settingsModal').classList.toggle('hidden'); }
        function saveSettings() { localStorage.setItem('mm_expert_api_key', document.getElementById('apiKeyInput').value); state.apiKey = document.getElementById('apiKeyInput').value; toggleSettings(); }
        function setLoading(l) { document.getElementById('loadingState').classList.toggle('hidden', !l); analyzeBtn.disabled = l; if(l) document.getElementById('emailSection').classList.add('hidden'); }
        function updateStatus(t) { document.getElementById('loadingText').innerText = t; }
    </script>
</body>
</html>
