<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>醫療靈媒食安分析 (MM Food Guard)</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#7D8B7E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="icon" type="image/png" href="./icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        body { background-color: #F9F7F3; }
        input[type="checkbox"] { accent-color: #7D8B7E; width: 1.25rem; height: 1.25rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(registration => console.log('ServiceWorker registration successful'))
                    .catch(err => console.log('ServiceWorker registration failed: ', err));
            });
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons ---
        const IconBase = ({ children, className = "w-6 h-6", ...props }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>{children}</svg>);
        const Camera = (props) => <IconBase {...props}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></IconBase>;
        const Upload = (props) => <IconBase {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></IconBase>;
        const Trash2 = (props) => <IconBase {...props}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></IconBase>;
        const Mail = (props) => <IconBase {...props}><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></IconBase>;
        const Heart = (props) => <IconBase {...props}><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></IconBase>;
        const Sparkles = (props) => <IconBase {...props}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M9 5H5"/><path d="M19 19v4"/><path d="M15 21h4"/></IconBase>;
        const ShieldAlert = (props) => <IconBase {...props}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="M12 8v4"/><path d="M12 16h.01"/></IconBase>;
        const Settings = (props) => <IconBase {...props}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></IconBase>;
        const X = (props) => <IconBase {...props}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconBase>;
        const Key = (props) => <IconBase {...props}><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></IconBase>;
        const Loader = (props) => <IconBase {...props}><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></IconBase>;

        const FoodGuardApp = () => {
            const [images, setImages] = useState([]);
            const [analyzing, setAnalyzing] = useState(false);
            const [results, setResults] = useState([]);
            const [currentProcessIndex, setCurrentProcessIndex] = useState(0);
            
            const [recipientList, setRecipientList] = useState([
                { email: "oliver603@gmail.com", selected: true },
                { email: "yofarn@gmail.com", selected: true }
            ]);
            const [sendingEmail, setSendingEmail] = useState(false);
            const [emailStatus, setEmailStatus] = useState(null);
            const [showSettings, setShowSettings] = useState(false);
            const [userApiKey, setUserApiKey] = useState("");
            const defaultApiKey = ""; 

            useEffect(() => {
                const storedKey = localStorage.getItem('food_guard_api_key');
                if (storedKey) setUserApiKey(storedKey);
                if (window.emailjs) window.emailjs.init("mYOFMMnqLdDxR0wjj");
            }, []);

            const handleSaveSettings = () => {
                localStorage.setItem('food_guard_api_key', userApiKey);
                setShowSettings(false);
            };

            const resizeImage = (file, maxDim = 1024, quality = 0.8) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            if (width > height) {
                                if (width > maxDim) { height *= maxDim / width; width = maxDim; }
                            } else {
                                if (height > maxDim) { width *= maxDim / height; height = maxDim; }
                            }
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            resolve(canvas.toDataURL('image/jpeg', quality)); 
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            };

            const createThumbnail = (file) => resizeImage(file, 160, 0.5);

            const handleImageUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                const newImages = [];
                for (const file of files) {
                    const [preview, thumbnail] = await Promise.all([
                        resizeImage(file, 1024, 0.8),
                        createThumbnail(file)
                    ]);
                    newImages.push({
                        id: Date.now() + Math.random(),
                        file, preview, thumbnail
                    });
                }
                setImages(prev => [...prev, ...newImages]);
            };

            const removeImage = (id) => setImages(images.filter(img => img.id !== id));

            const analyzeImages = async () => {
                const activeKey = userApiKey || defaultApiKey;
                if (!activeKey) {
                    alert("請先點擊右上角齒輪設定您的 Google API Key。");
                    setShowSettings(true);
                    return;
                }
                if (images.length === 0) {
                    alert("請先選擇至少一張圖片");
                    return;
                }

                setAnalyzing(true);
                setResults([]); 
                setEmailStatus(null);
                setCurrentProcessIndex(0);

                const promptText = `
                    **重要指令：你是一個純 JSON 資料生成器。**
                    你現在是醫療靈媒安東尼·威廉（Anthony William）。請根據你的飲食哲學，對圖片中的食物進行【風險評級分析】。
                    **嚴格禁止**回傳任何問候語或Markdown標記(如 \`\`\`json)，只回傳純文字的 JSON。

                    **評分標準 (0-10) riskScore：**
                    1. **療癒區 (0-3)**: 純天然、無油、整全食物 (如藍莓、西芹汁)。
                    2. **緩衝區 (4-6)**: 熟食、少量油脂、無麩質/無奶 (如蒸馬鈴薯、燕麥粥)。
                    3. **警戒區 (7-8)**: 含一級違禁品 (麩質、蛋、奶、玉米、大豆)。
                    4. **危險區 (9-10)**: 高脂+高糖、豬肉、養殖魚、味精、人工添加物。

                    **輸出格式要求：**
                    請只回傳一個標準的 JSON 陣列，裡面包含一個物件，格式如下：
                    [{
                        "productName": "產品名稱",
                        "price": "價格或N/A",
                        "ingredients": "成份列表(推測)",
                        "badIngredients": "違禁品/毒素",
                        "badEffect": "危害說明",
                        "goodIngredients": "療癒成份",
                        "goodEffect": "益處說明",
                        "riskScore": 9.5,
                        "mmComment": "簡短評語"
                    }]
                `;

                try {
                    for (let i = 0; i < images.length; i++) {
                        setCurrentProcessIndex(i + 1);
                        const img = images[i];
                        
                        try {
                            const base64Data = img.preview.split(',')[1];
                            const parts = [
                                { text: promptText },
                                { inlineData: { mimeType: "image/jpeg", data: base64Data } }
                            ];

                            const response = await fetch(
                                `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${activeKey}`,
                                {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        contents: [{ parts: parts }] 
                                    })
                                }
                            );

                            if (!response.ok) continue;

                            const data = await response.json();
                            const textResponse = data.candidates?.[0]?.content?.parts?.[0]?.text;

                            if (textResponse) {
                                const jsonStartIndex = textResponse.indexOf('[');
                                const jsonEndIndex = textResponse.lastIndexOf(']') + 1;

                                if (jsonStartIndex !== -1 && jsonEndIndex !== -1) {
                                    const cleanJson = textResponse.substring(jsonStartIndex, jsonEndIndex);
                                    try {
                                        const parsedData = JSON.parse(cleanJson);
                                        const resultItem = Array.isArray(parsedData) ? parsedData[0] : parsedData;
                                        
                                        resultItem.thumbnail = img.thumbnail; 
                                        setResults(prev => [...prev, resultItem]);
                                    } catch (e) {
                                        console.error("JSON 解析失敗:", e);
                                    }
                                }
                            }
                        } catch (err) {
                            console.error(`Error processing image ${i + 1}`, err);
                        }

                        if (i < images.length - 1) {
                            await new Promise(resolve => setTimeout(resolve, 2000));
                        }
                    }
                } catch (error) {
                    alert("流程發生錯誤: " + error.message);
                } finally {
                    setAnalyzing(false);
                }
            };

            const sendEmail = () => {
                const selectedEmails = recipientList.filter(r => r.selected).map(r => r.email);
                if (!results || results.length === 0 || selectedEmails.length === 0) {
                    alert("請確認有分析結果且至少勾選一個收件人");
                    return;
                }
                setSendingEmail(true);

                const tableRows = results.map(item => `
                    <tr style="border-bottom: 1px solid #ddd; background-color: #ffffff;">
                        <td style="padding: 10px; text-align: center; vertical-align: middle; width: 15%;">
                            <img src="${item.thumbnail}" style="max-width: 80px; height: auto; border-radius: 6px; border: 1px solid #eee; display: block; margin: 0 auto;" />
                        </td>
                        <td style="padding: 12px; vertical-align: top; width: 20%;">
                            <strong style="font-size: 14px; color: #333;">${item.productName}</strong><br/>
                            <span style="font-size: 12px; color: #888;">${item.price}</span>
                        </td>
                        <td style="padding: 12px; vertical-align: top; text-align: center; width: 10%;">
                            <div style="background-color: ${item.riskScore >= 7 ? '#DDA0A0' : item.riskScore >= 4 ? '#E4C7C2' : '#A8B5A3'}; color: white; padding: 4px 8px; border-radius: 12px; font-weight: bold; font-size: 14px; display: inline-block;">
                                ${item.riskScore}
                            </div>
                        </td>
                        <td style="padding: 12px; vertical-align: top; font-size: 13px; color: #555; width: 25%;">
                            ${item.badIngredients ? `<div style="color: #c08080; margin-bottom: 6px;"><strong>⚠️ 高危:</strong> ${item.badIngredients}</div>` : ''}
                            ${item.goodIngredients ? `<div style="color: #5e7a63;"><strong>🌿 療癒:</strong> ${item.goodIngredients}</div>` : ''}
                        </td>
                        <td style="padding: 12px; vertical-align: top; font-size: 13px; font-style: italic; color: #666; width: 30%;">
                            "${item.mmComment}"
                        </td>
                    </tr>
                `).join('');

                const now = new Date();
                const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                
                const emailHtml = `
                    <div style="font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; color: #333;">
                        <h2 style="color: #7D8B7E; text-align: center; border-bottom: 2px solid #7D8B7E; padding-bottom: 10px;">MM 食安分析報告 (${dateStr})</h2>
                        <table width="100%" cellpadding="0" cellspacing="0" style="border-collapse: collapse; width: 100%; margin-top: 20px; border: 1px solid #eee;">
                            <thead>
                                <tr style="background-color: #7D8B7E; color: white; text-align: left;">
                                    <th style="padding: 10px; width: 15%; text-align: center;">圖片</th>
                                    <th style="padding: 10px; width: 20%;">產品</th>
                                    <th style="padding: 10px; width: 10%; text-align: center;">分數</th>
                                    <th style="padding: 10px; width: 25%;">成份重點</th>
                                    <th style="padding: 10px; width: 30%;">靈媒點評</th>
                                </tr>
                            </thead>
                            <tbody>${tableRows}</tbody>
                        </table>
                        <p style="text-align: center; color: #999; font-size: 12px; margin-top: 30px;">
                            此報告由 AI 生成，僅供參考，請以《醫療靈媒》原著為準。
                        </p>
                    </div>
                `;

                const templateParams = {
                    email: selectedEmails.join(','),
                    to_email: selectedEmails.join(','),
                    recipient: selectedEmails.join(','),
                    subject: `MM Food Report ${dateStr}`,
                    message: emailHtml,  
                };

                window.emailjs.send('service_5yh7x6g', 'template_dlbyml8', templateParams)
                .then(() => { setEmailStatus('success'); })
                .catch((err) => { setEmailStatus('error'); alert("發送失敗: " + JSON.stringify(err)); })
                .finally(() => { setSendingEmail(false); });
            };

            return (
                <div className="min-h-screen font-sans pb-10 transition-colors duration-300" style={{ backgroundColor: '#F9F7F3', color: '#333333' }}>
                    <header className="p-4 sticky top-0 z-20 shadow-md backdrop-blur-md bg-[#7D8B7E]/95 text-white">
                        <div className="max-w-4xl mx-auto flex items-center justify-between">
                            <h1 className="text-xl font-bold flex items-center gap-2 tracking-wide">
                                <Sparkles className="w-6 h-6 text-[#E4C7C2]" /> 醫療靈媒食安分析
                            </h1>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setShowSettings(true)} className="p-2 rounded-full hover:bg-[#A8B5A3]/50 transition-colors" style={{ backgroundColor: 'rgba(255,255,255,0.2)' }}><Settings className="w-5 h-5" /></button>
                                <span className="text-xs px-3 py-1 rounded-full font-medium" style={{ backgroundColor: '#A8B5A3', color: '#333' }}>MM Food</span>
                            </div>
                        </div>
                    </header>

                    {showSettings && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 backdrop-blur-sm bg-[#7D8B7E]/20">
                            <div className="rounded-2xl shadow-2xl w-full max-w-md overflow-hidden bg-[#F9F7F3] border border-[#E4C7C2]">
                                <div className="p-4 flex justify-between items-center text-white" style={{ backgroundColor: '#7D8B7E' }}>
                                    <h3 className="font-bold text-lg flex items-center gap-2"><Settings className="w-5 h-5" /> 設定 API Key</h3>
                                    <button onClick={() => setShowSettings(false)} className="hover:bg-[#A8B5A3] p-1 rounded"><X className="w-5 h-5" /></button>
                                </div>
                                <div className="p-6 space-y-6">
                                    <div className="space-y-2">
                                        <label className="block text-sm font-bold" style={{ color: '#7D8B7E' }}>Google Gemini API Key</label>
                                        <input type="password" value={userApiKey} onChange={(e) => setUserApiKey(e.target.value)} placeholder="輸入 AI Studio Key..." className="w-full pl-4 pr-4 py-3 border-2 rounded-xl focus:outline-none text-sm font-mono transition-all" style={{ borderColor: '#A8B5A3', backgroundColor: '#fff', color: '#333' }} />
                                    </div>
                                    <p className="text-xs mt-2" style={{ color: '#7D8B7E', opacity: 0.8 }}>
                                        * 金鑰將儲存在您的瀏覽器中。
                                        <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer" style={{ color: '#DDA0A0', fontWeight: 'bold', textDecoration: 'underline', marginLeft: '4px' }}>
                                            點此免費取得 API Key
                                        </a>
                                    </p>
                                    <button onClick={handleSaveSettings} className="w-full py-3 rounded-xl font-bold text-white transition-all shadow-[0_4px_0_0_#DDA0A0] hover:translate-y-[2px] active:shadow-none active:translate-y-[4px]" style={{ backgroundColor: '#7D8B7E' }}>儲存並關閉</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="max-w-4xl mx-auto p-4 space-y-6">
                        <div className="space-y-3">
                            <label className="block w-full cursor-pointer group">
                                <input type="file" multiple accept="image/*" onChange={handleImageUpload} className="hidden" />
                                <div className="border-2 border-dashed rounded-2xl h-36 flex flex-col items-center justify-center gap-3 transition-all group-hover:bg-[#E4C7C2]/10" style={{ borderColor: '#A8B5A3', backgroundColor: 'rgba(255,255,255,0.4)', color: '#7D8B7E' }}>
                                    <div className="p-3 rounded-full bg-[#A8B5A3]/20 group-hover:scale-110 transition-transform"><Camera className="w-8 h-8" /></div>
                                    <span className="font-medium tracking-wide">拍攝食物 / 成份表 (可多張)</span>
                                </div>
                            </label>

                            {images.length > 0 && (
                                <div className="grid grid-cols-3 gap-3">
                                    {images.map((img) => (
                                        <div key={img.id} className="relative group aspect-square rounded-xl overflow-hidden shadow-sm border border-[#E4C7C2]/50">
                                            <img src={img.preview} className="w-full h-full object-cover" />
                                            <button onClick={() => removeImage(img.id)} className="absolute top-1 right-1 p-1.5 rounded-full shadow-sm backdrop-blur-sm opacity-90 hover:opacity-100 transition-all" style={{ backgroundColor: '#DDA0A0', color: 'white' }}><Trash2 className="w-4 h-4" /></button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        {images.length > 0 && results.length < images.length && !analyzing && (
                            <button onClick={analyzeImages} className="w-full py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 transition-all active:scale-95 hover:translate-y-[2px] active:translate-y-[4px]" style={{ backgroundColor: '#7D8B7E', color: 'white', boxShadow: '0 4px 0 0 #DDA0A0' }}>
                                <Upload className="w-5 h-5" /> 開始 MM 食安分析
                            </button>
                        )}
                        
                        {analyzing && (
                            <button disabled className="w-full py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 transition-all opacity-80 cursor-not-allowed" style={{ backgroundColor: '#A8B5A3', color: 'white' }}>
                                <Loader className="w-5 h-5 animate-spin" /> 
                                分析中... ({currentProcessIndex}/{images.length})
                            </button>
                        )}

                        {results.length > 0 && (
                            <div className="space-y-6 animate-fade-in">
                                <h2 className="text-xl font-bold pl-3 flex items-center gap-2 border-l-4" style={{ color: '#7D8B7E', borderColor: '#DDA0A0' }}>
                                    分析報告 <span className="text-xs font-normal px-2 py-1 rounded-full" style={{ backgroundColor: '#E4C7C2', color: '#333' }}>MM Perspective</span>
                                </h2>

                                <div className="grid gap-4">
                                    {results.map((item, idx) => (
                                        <div key={idx} className="rounded-2xl overflow-hidden shadow-sm transition-all hover:shadow-md" style={{ backgroundColor: 'rgba(255, 255, 255, 0.8)', border: '1px solid rgba(168, 181, 163, 0.3)', backdropFilter: 'blur(10px)' }}>
                                            <div className="p-4 border-b flex justify-between items-center" style={{ borderColor: '#F9F7F3', backgroundColor: 'rgba(168, 181, 163, 0.1)' }}>
                                                <h3 className="font-bold text-lg" style={{ color: '#333' }}>{item.productName || "未知產品"}</h3>
                                                <span className="text-sm font-mono px-3 py-1 rounded-full border shadow-sm" style={{ backgroundColor: '#fff', borderColor: '#E4C7C2', color: '#7D8B7E' }}>{item.price}</span>
                                            </div>
                                            <div className="p-5 space-y-5">
                                                <div className="flex items-start gap-4">
                                                    <div className="flex-shrink-0 flex flex-col items-center gap-1">
                                                        <div className={`w-16 h-16 rounded-full flex items-center justify-center text-white font-bold text-2xl shadow-inner`} style={{ backgroundColor: item.riskScore >= 7 ? '#DDA0A0' : item.riskScore >= 4 ? '#E4C7C2' : '#A8B5A3' }}>
                                                            {item.riskScore}
                                                        </div>
                                                        <span className="text-[10px] font-bold uppercase" style={{ color: '#A8B5A3' }}>Risk Score</span>
                                                    </div>
                                                    <div className="flex-grow">
                                                        <h4 className="text-xs font-bold uppercase tracking-wider mb-2" style={{ color: '#7D8B7E' }}>主要成份</h4>
                                                        <p className="text-sm leading-relaxed p-3 rounded-xl border" style={{ backgroundColor: '#F9F7F3', borderColor: '#E4C7C2', color: '#555' }}>{item.ingredients}</p>
                                                    </div>
                                                </div>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    <div className="rounded-xl p-4 border transition-colors" style={{ backgroundColor: item.riskScore >= 7 ? 'rgba(221, 160, 160, 0.1)' : '#F9F7F3', borderColor: item.riskScore >= 7 ? '#DDA0A0' : '#E0E0E0' }}>
                                                        <h4 className="font-bold flex items-center gap-2 mb-2" style={{ color: '#DDA0A0' }}><ShieldAlert className="w-5 h-5" /> 高危與病毒餵養</h4>
                                                        {item.badIngredients ? ( <> <div className="text-sm font-bold mb-1" style={{ color: '#c08080' }}>⚠️ 含: {item.badIngredients}</div> <p className="text-sm leading-relaxed opacity-80" style={{ color: '#8b5e5e' }}>{item.badEffect}</p> </> ) : ( <p className="text-sm italic" style={{ color: '#A8B5A3' }}>未檢測到明顯的 No-Foods</p> )}
                                                    </div>
                                                    <div className="rounded-xl p-4 border" style={{ backgroundColor: 'rgba(168, 181, 163, 0.15)', borderColor: '#A8B5A3' }}>
                                                        <h4 className="font-bold flex items-center gap-2 mb-2" style={{ color: '#7D8B7E' }}><Heart className="w-5 h-5" /> 療癒與排毒</h4>
                                                        {item.goodIngredients ? ( <> <div className="text-sm font-bold mb-1" style={{ color: '#5e7a63' }}>🌿 含: {item.goodIngredients}</div> <p className="text-sm leading-relaxed opacity-90" style={{ color: '#5e7a63' }}>{item.goodEffect}</p> </> ) : ( <p className="text-sm italic" style={{ color: '#A8B5A3' }}>未檢測到強力療癒食材</p> )}
                                                    </div>
                                                </div>
                                                <div className="p-4 rounded-xl border relative mt-2" style={{ backgroundColor: '#fff', borderColor: '#7D8B7E' }}>
                                                    <div className="absolute -top-3 left-4 text-white text-xs px-2 py-0.5 rounded shadow-sm" style={{ backgroundColor: '#7D8B7E' }}>靈媒點評</div>
                                                    <p className="text-sm font-medium italic mt-1 leading-relaxed" style={{ color: '#555' }}>"{item.mmComment}"</p>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <div className="rounded-2xl p-6 shadow-sm border space-y-4 backdrop-blur-md" style={{ backgroundColor: 'rgba(255, 255, 255, 0.9)', borderColor: '#E4C7C2' }}>
                                    <h3 className="font-bold flex items-center gap-2 text-lg" style={{ color: '#7D8B7E' }}><Mail className="w-5 h-5" /> 發送報告</h3>
                                    <div className="flex flex-col gap-3">
                                        <div className="space-y-2 mb-2">
                                            {recipientList.map((r, index) => (
                                                <label key={index} className="flex items-center gap-3 p-3 rounded-xl border bg-[#F9F7F3] cursor-pointer hover:bg-white transition-colors" style={{ borderColor: '#A8B5A3' }}>
                                                    <input type="checkbox" checked={r.selected} onChange={() => { const newList = [...recipientList]; newList[index].selected = !newList[index].selected; setRecipientList(newList); }} />
                                                    <span className="text-sm font-mono text-[#333]">{r.email}</span>
                                                </label>
                                            ))}
                                        </div>
                                        <button onClick={sendEmail} disabled={sendingEmail} className="w-full py-3 rounded-xl font-bold text-white transition-all active:scale-95 hover:translate-y-[1px] active:translate-y-[3px]" style={{ backgroundColor: '#7D8B7E', boxShadow: sendingEmail ? 'none' : '0 4px 0 0 #DDA0A0', opacity: sendingEmail ? 0.7 : 1 }}>
                                            {sendingEmail ? "發送中..." : "發送完整表格報告"}
                                        </button>
                                    </div>
                                    {emailStatus === 'success' && <div className="p-3 rounded-lg text-center text-sm font-medium animate-pulse" style={{ backgroundColor: '#A8B5A3', color: 'white' }}>✅ Email 發送成功！</div>}
                                    {emailStatus === 'error' && <div className="p-3 rounded-lg text-center text-sm font-medium" style={{ backgroundColor: '#DDA0A0', color: 'white' }}>❌ 發送失敗，請檢查網路。</div>}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FoodGuardApp />);
    </script>
</body>
</html>
